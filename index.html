<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>bing bong</title>
<style>

  :root{
    --background: #231815; /* dark brown page background, emoji background, qty button colour */ 
    --foreground: #afbcd6; /* powder blue, item background, running total background, qty button symbols */ 
    --highlight: #ff4d2d; /* neon orange, colour when something is selected */  
    --accent1: #f5efc6; /* creamy, all outlines of boxes and buttons */  
    --accent2: #231815; /* dark brown, rest of text */  
    --text1: #f5efc6; /* bing bong, running total, item names, macro and cal headings, clear plate and finalise menu text */  
    --text2: #afbcd6; /* powder blue, plate bb, no of items on plate, mactos grams */  
    --mono: Helvetica, sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--background);
    color: var(--text2);
    font-family: Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }



  header{
    padding: 2.5rem 1.5rem 1.5rem;
    text-align: left;
    max-width: 1100px;
    margin: 0 auto;
    border-bottom: 3px solid var(--text2);
  }

  header h1{
    font-size: 2.1rem;
    margin: 0 0 0.35rem;
    letter-spacing: 0.01em;
    font-weight: 700;
  }

  header p{
    margin: 0;
    color: var(--text2);
    font-size: 0.98rem;
    max-width: 46ch;
  }

  .layout{
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.75rem;
  }

  @media (min-width: 860px){
    .layout{
      grid-template-columns: 1fr 320px;
      align-items: start;
    }
  }
  @media (max-width: 859px){
    #totals-panel{
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 35vh;
      overflow-y: auto;
      z-index: 50;
      border-left: none;
      border-right: none;
      border-bottom: none;
    }

    .layout{
      padding-bottom: 35vh; /* stops the ingredient grid from being hidden behind the fixed panel */
    }
  }
  /* ---- Ingredient grid ---- */

  #ingredient-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.9rem;
  }

  .ingredient{
    background: var(--foreground);
    border: 2px solid var(--accent1);
    cursor: pointer;
    padding: 0.6rem 0.6rem 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    user-select: none;
  }

  .ingredient:hover{
    transform: translateY(-2px);
  }

  .ingredient:focus-visible{
    outline: 3px solid var(--background);
    outline-offset: 2px;
  }

  .ingredient .thumb{
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--background);
    border: 1px solid var(--accent1);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .ingredient .thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ingredient .thumb .fallback{
    font-size: 2rem;
  }

  .ingredient .name{
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text1);
  }

  .ingredient .serving{
    font-size: 0.72rem;
    color: var(--text1);
    font-style: italic;
    margin-top: 0.1rem;
  }

  .ingredient .cal-tag{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text1);
    margin-top: 0.25rem;
  }

  .ingredient.selected{
    background: var(--highlight);
    border-color: var(--accent1);
    box-shadow: 4px 4px 0 var(--foreground);
  }

  .ingredient.selected::after{
    content: "on plate";
    position: absolute;
    top: 6px;
    right: 8px;
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--background);
    background: var(--foreground);
    padding: 0 3px;
  }

  /* ---- Quantity stepper ---- */

  .stepper{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.65rem;
    width: 100%;
  }

  .stepper button{
    width: 26px;
    height: 26px;
    border: 2px solid var(--accent1);
    background: var(--background);
    color: var(--foreground);
    font-family: var(--mono);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .stepper button:hover{
    background: var(--foreground);
    color: var(--background);
  }

  .stepper button:disabled{
    opacity: 0.3;
    cursor: default;
    background: var(--background);
    color: var(--background);
  }

  .stepper .qty{
    font-family: var(--mono);
    font-weight: bold;
    font-size: 0.95rem;
    min-width: 1.4em;
    text-align: center;
    color: var(--accent1);
  }

  /* ---- Totals panel ---- */

  #totals-panel{
    background: var(--background);
    color: var(--text1);
    padding: 1.5rem;
    position: sticky;
    top: 1.5rem;
    border: 2px solid var(--accent1);
  }

  #totals-panel h2{
    margin: 0 0 0.2rem;
    font-size: 1.1rem;
    font-family: var(--mono);
    border-bottom: 1px solid rgba(255,255,255,0.25);
    padding-bottom: 0.6rem;
  }

  #totals-panel .count{
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text1);
    margin-bottom: 1rem;
  }

  .totals-list{
    list-style: none;
    margin: 0 0 1.25rem;
    padding: 0;
  }

  .totals-list li{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.5rem 0;
    border-bottom: 1px dashed rgba(255,255,255,0.18);
  }

  .totals-list li .label{
    font-size: 0.85rem;
    color: var(--text1);
  }

  .totals-list li .value{
    font-family: var(--mono);
    font-size: 1.05rem;
    font-weight: bold;
  }

  .totals-list li.cal-row .value{
    font-size: 1.5rem;
    color: var(--text1);
  }

  .totals-list li.cal-row .label{
    font-size: 0.95rem;
    color: var(--text1);
  }

  #selected-items{
    font-size: 0.78rem;
    color: var(--text1);
    line-height: 1.6;
    min-height: 1.5em;
  }

  #reset-btn{
    margin-top: 1.1rem;
    width: 100%;
    background: transparent;
    border: 1px solid var(--accent1);
    color: var(background);
    padding: 0.55rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  #reset-btn:hover{
    background: var(--highlight);
  }

  #reset-btn:disabled{
    opacity: 0.4;
    cursor: default;
  }

  #finalize-btn{
    margin-top: 0.6rem;
    width: 100%;
    background: var(--foreground);
    border: 1px solid var(--accent1);
    color: var(--text1);
    padding: 0.7rem;
    font-family: var(--mono);
    font-size: 0.92rem;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.01em;
  }

  #finalize-btn:hover{
    background: var(--highlight);
  }

  #finalize-btn:disabled{
    opacity: 0.35;
    cursor: default;
    background: var(--background);
    border-color: var(--background);
  }

  /* ---- Finalize modal ---- */

  #finalize-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 12, 0.75);
    z-index: 100;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 2rem 1rem;
  }

  #finalize-overlay.open{
    display: flex;
  }

  .finalize-modal{
    background: var(--background);
    border: 2px solid var(--accent1);
    max-width: 420px;
    width: 100%;
    padding: 1.25rem;
    text-align: center;
  }

  .finalize-modal h3{
    margin: 0 0 1rem;
    font-size: 1.05rem;
  }

  #finalize-canvas{
    width: 100%;
    height: auto;
    border: 1px solid var(--accent1);
    display: block;
    margin-bottom: 1rem;
  }

  .finalize-actions{
    display: flex;
    gap: 0.6rem;
  }

  .finalize-actions a, .finalize-actions button{
    flex: 1;
    padding: 0.65rem;
    font-family: var(--mono);
    font-size: 0.9rem;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
    border: 2px solid var(--accent1);
  }

  .finalize-actions a{
    background: var(--foreground);
    color: var(--background);
  }

  .finalize-actions button{
    background: transparent;
    color: var(--foreground);
  }

  .finalize-hint{
    font-size: 0.75rem;
    color: var(--text2);
    margin-top: 0.7rem;
  }

</style>
</head>
<body>

<header>
  <h1>Bing bong, fuck ya life</h1>
  <p>Fill up your plate bb</p>
</header>

<div class="layout">

  <div id="ingredient-grid"></div>

  <aside id="totals-panel">
    <h2>Running total</h2>
    <div class="count" id="item-count">0 items on your plate</div>

    <ul class="totals-list">
      <li class="cal-row">
        <span class="label">Calories</span>
        <span class="value"><span id="total-calories">0</span> cal</span>
      </li>
      <li>
        <span class="label">Protein</span>
        <span class="value"><span id="total-protein">0</span> g</span>
      </li>
      <li>
        <span class="label">Carbs</span>
        <span class="value"><span id="total-carbs">0</span> g</span>
      </li>
      <li>
        <span class="label">Fat</span>
        <span class="value"><span id="total-fat">0</span> g</span>
      </li>
    </ul>

    <div id="selected-items">Nothing selected yet.</div>

    <button id="reset-btn" disabled>Clear plate</button>
    <button id="finalize-btn" disabled>Finalise menu</button>
  </aside>

</div>

<div id="finalize-overlay">
  <div class="finalize-modal">
    <h3>Your meal summary</h3>
    <canvas id="finalize-canvas"></canvas>
    <div class="finalize-actions">
      <a id="download-link" download="meal-summary.png">Save image</a>
      <button id="close-finalize">Close</button>
    </div>
    <div class="finalize-hint">On phone: tap "Save image", or press and hold the image above to save it to your photos.</div>
  </div>
</div>

<script>

  /* ============================================================
     INGREDIENT DATA
     ------------------------------------------------------------
     Add, remove, or edit ingredients here. Each entry needs:

       id       - unique short string, no spaces
       name     - display name
       serving  - text shown under the name describing ONE unit,
                  e.g. "1 large" or "100g" or "1 slice"
       image    - path to an image file (put images in an
                  "images" folder next to this index.html), OR
                  leave as "" to show the emoji fallback instead
       emoji    - shown if "image" is empty or fails to load
       calories - cal, PER ONE SERVING (as described above)
       protein  - grams, per one serving
       carbs    - grams, per one serving
       fat      - grams, per one serving

     Nutrition values are per ONE serving. If someone sets the
     quantity to 2, all four values are simply doubled - so make
     sure "serving" accurately describes what one unit means.
     ============================================================ */

  const INGREDIENTS = [
    { id: "egg",          name: "Boiled egg",        serving: "1 large",   image: "", emoji: "🥚", calories: 77,  protein: 6.3, carbs: 0.5,  fat: 5.4 },
    { id: "chicken",      name: "Chicken",           serving: "100g",      image: "", emoji: "🍗", calories: 195, protein: 29.5,  carbs: 0,    fat: 7.7 },
    { id: "brocc",        name: "Blanched broccoli", serving: "100g",      image: "", emoji: "🥦", calories: 34, protein: 2.8, carbs: 6.6,   fat: 0.4 },
    { id: "cucumber",     name: "Cucumber",          serving: "1 large",   image: "", emoji: "🥒", calories: 45, protein: 1.9,   carbs: 10.9,   fat: 0.3  },
    { id: "tomato",       name: "Tomato",            serving: "1 large",   image: "", emoji: "🍅", calories: 33, protein: 1.6, carbs: 7.1,   fat: 0.3 },
    { id: "sardine",      name: "Sardines",          serving: "1 tin 75g",        image: "", emoji: "🐠", calories: 132, protein: 14.1,   carbs: 1.4,    fat: 7.9  },
    { id: "cottage",      name: "Cottage cheese",    serving: "100g",      image: "", emoji: "🧀", calories: 82,  protein: 12, carbs: 4.3,   fat: 1.8 },
    { id: "pickle",       name: "Pickles",           serving: "3 pickles 100ishg",     image: "", emoji: "🫙", calories: 22, protein: 0.7,  carbs: 4.4,    fat: 0.2  },
    { id: "tuna",         name: "Tuna springwater",  serving: "1 tin 69g", image: "", emoji: "🐟", calories: 75, protein: 17.6,   carbs: 0,    fat: 0  },
    { id: "greek",        name: "Greek yoghurt",     serving: "130g",      image: "", emoji: "🥣", calories: 98,  protein: 6.8, carbs: 8.1,   fat: 4.3 },
    { id: "nuoc",         name: "Nuoc cham",         serving: "1 tbs",     image: "", emoji: "🍶", calories: 31, protein: 0.3,  carbs: 7.3,    fat: 0  },
    { id: "thins",        name: "Multigrain corn thins",            serving: "3 thins",  image: "", emoji: "🫓", calories: 68,  protein: 1.9, carbs: 13,   fat: 0.6  },
    { id: "carrot",       name: "Carrot",             serving: "1 medium",  image: "", emoji: "🥕", calories: 30,  protein: 0.6, carbs: 6.9,   fat: 0.1  },
    { id: "milk",         name: "Full cream milk",    serving: "100ml",  image: "", emoji: "🥛", calories: 63,  protein: 3.3, carbs: 4.8,   fat: 3.4  },
    { id: "sugar",        name: "Sugar",              serving: "1 tsp",  image: "", emoji: "🍯", calories: 16,  protein: 0, carbs: 4.2,   fat: 0  },
    { id: "shot",         name: "Espresso shot",      serving: "1 shot",  image: "", emoji: "☕", calories: 6,  protein: 0.4, carbs: 1,   fat: 0  },
  ];

  /* ============================================================
     APP LOGIC — you shouldn't need to touch anything below this
     ============================================================ */

  // Maps ingredient id -> quantity currently on the plate (0 = not selected)
  const quantities = {};

  const grid = document.getElementById("ingredient-grid");
  const totalCaloriesEl = document.getElementById("total-calories");
  const totalProteinEl = document.getElementById("total-protein");
  const totalCarbsEl = document.getElementById("total-carbs");
  const totalFatEl = document.getElementById("total-fat");
  const itemCountEl = document.getElementById("item-count");
  const selectedItemsEl = document.getElementById("selected-items");
  const resetBtn = document.getElementById("reset-btn");
  const finalizeBtn = document.getElementById("finalize-btn");
  const finalizeOverlay = document.getElementById("finalize-overlay");
  const finalizeCanvas = document.getElementById("finalize-canvas");
  const downloadLink = document.getElementById("download-link");
  const closeFinalizeBtn = document.getElementById("close-finalize");

  function renderGrid(){
    grid.innerHTML = "";
    const sortedIngredients = [...INGREDIENTS].sort((a, b) => a.name.localeCompare(b.name));
    sortedIngredients.forEach(ing => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "ingredient";
      card.dataset.id = ing.id;
      card.setAttribute("aria-pressed", "false");

      const thumb = document.createElement("div");
      thumb.className = "thumb";

      if (ing.image){
        const img = document.createElement("img");
        img.src = ing.image;
        img.alt = ing.name;
        img.onerror = () => {
          thumb.innerHTML = `<span class="fallback">${ing.emoji || "🍽️"}</span>`;
        };
        thumb.appendChild(img);
      } else {
        thumb.innerHTML = `<span class="fallback">${ing.emoji || "🍽️"}</span>`;
      }

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = ing.name;

      const serving = document.createElement("div");
      serving.className = "serving";
      serving.textContent = ing.serving ? `per ${ing.serving}` : "";

      const calTag = document.createElement("div");
      calTag.className = "cal-tag";
      calTag.textContent = `${ing.calories} cal`;

      // Quantity stepper: minus button, quantity display, plus button
      const stepper = document.createElement("div");
      stepper.className = "stepper";
      stepper.addEventListener("click", (e) => e.stopPropagation()); // don't let clicks bubble to the card

      const minusBtn = document.createElement("button");
      minusBtn.type = "button";
      minusBtn.textContent = "−";
      minusBtn.setAttribute("aria-label", `Remove one ${ing.name}`);

      const qtyDisplay = document.createElement("span");
      qtyDisplay.className = "qty";
      qtyDisplay.textContent = "0";

      const plusBtn = document.createElement("button");
      plusBtn.type = "button";
      plusBtn.textContent = "+";
      plusBtn.setAttribute("aria-label", `Add one ${ing.name}`);

      minusBtn.addEventListener("click", () => changeQuantity(ing.id, -1, card, qtyDisplay, minusBtn));
      plusBtn.addEventListener("click", () => changeQuantity(ing.id, 1, card, qtyDisplay, minusBtn));

      stepper.appendChild(minusBtn);
      stepper.appendChild(qtyDisplay);
      stepper.appendChild(plusBtn);

      card.appendChild(thumb);
      card.appendChild(name);
      if (ing.serving) card.appendChild(serving);
      card.appendChild(calTag);
      card.appendChild(stepper);

      // Clicking anywhere else on the card adds one serving
      card.addEventListener("click", () => toggleCard(ing.id, card, qtyDisplay, minusBtn));

      minusBtn.disabled = true;

      grid.appendChild(card);
    });
  }

  function toggleCard(id, cardEl, qtyDisplayEl, minusBtnEl){
    const current = quantities[id] || 0;

    if (current > 0){
      // already on the plate — remove it entirely
      quantities[id] = 0;
      qtyDisplayEl.textContent = "0";
      minusBtnEl.disabled = true;
      cardEl.classList.remove("selected");
      cardEl.setAttribute("aria-pressed", "false");
    } else {
      // not on the plate — add one
      quantities[id] = 1;
      qtyDisplayEl.textContent = "1";
      minusBtnEl.disabled = false;
      cardEl.classList.add("selected");
      cardEl.setAttribute("aria-pressed", "true");
    }

    updateTotals();
  }

  function changeQuantity(id, delta, cardEl, qtyDisplayEl, minusBtnEl){
    const current = quantities[id] || 0;
    const next = Math.max(0, current + delta);
    quantities[id] = next;

    qtyDisplayEl.textContent = next;
    minusBtnEl.disabled = next === 0;

    if (next > 0){
      cardEl.classList.add("selected");
      cardEl.setAttribute("aria-pressed", "true");
    } else {
      cardEl.classList.remove("selected");
      cardEl.setAttribute("aria-pressed", "false");
    }

    updateTotals();
  }

  function updateTotals(){
    let calories = 0, protein = 0, carbs = 0, fat = 0;
    let itemCount = 0;
    const summary = [];

    INGREDIENTS.forEach(ing => {
      const qty = quantities[ing.id] || 0;
      if (qty <= 0) return;
      calories += ing.calories * qty;
      protein += ing.protein * qty;
      carbs += ing.carbs * qty;
      fat += ing.fat * qty;
      itemCount += qty;
      summary.push(qty > 1 ? `${ing.name} ×${qty}` : ing.name);
    });

    totalCaloriesEl.textContent = Math.round(calories);
    totalProteinEl.textContent = round1(protein);
    totalCarbsEl.textContent = round1(carbs);
    totalFatEl.textContent = round1(fat);

    itemCountEl.textContent = `${itemCount} item${itemCount === 1 ? "" : "s"} on your plate`;
    selectedItemsEl.textContent = summary.length ? summary.join(", ") : "Nothing selected yet.";
    resetBtn.disabled = itemCount === 0;
    finalizeBtn.disabled = itemCount === 0;
  }

  function round1(n){
    return Math.round(n * 10) / 10;
  }

  resetBtn.addEventListener("click", () => {
    Object.keys(quantities).forEach(id => quantities[id] = 0);
    document.querySelectorAll(".ingredient").forEach(el => {
      el.classList.remove("selected");
      el.setAttribute("aria-pressed", "false");
      el.querySelector(".qty").textContent = "0";
      el.querySelector(".stepper button").disabled = true;
    });
    updateTotals();
  });

  /* ---- Finalize menu: draw a summary card onto a canvas ---- */

  function buildMealItems(){
    const items = [];
    let calories = 0, protein = 0, carbs = 0, fat = 0;

    INGREDIENTS.forEach(ing => {
      const qty = quantities[ing.id] || 0;
      if (qty <= 0) return;
      const lineCalories = ing.calories * qty;
      const lineProtein = ing.protein * qty;
      const lineCarbs = ing.carbs * qty;
      const lineFat = ing.fat * qty;
      calories += lineCalories;
      protein += lineProtein;
      carbs += lineCarbs;
      fat += lineFat;
      items.push({
        name: ing.name,
        serving: ing.serving || "",
        qty,
        calories: lineCalories,
        protein: lineProtein,
        carbs: lineCarbs,
        fat: lineFat
      });
    });

    return { items, calories, protein, carbs, fat };
  }

  function drawMealCard(){
    const { items, calories, protein, carbs, fat } = buildMealItems();

    // Layout constants (drawn at 2x scale for crisp phone screens)
    const scale = 2;
    const width = 420 * scale;
    const paddingX = 28 * scale;
    const rowHeight = 34 * scale;
    const headerHeight = 108 * scale;
    const totalsHeight = 150 * scale;
    const footerHeight = 40 * scale;
    const height = headerHeight + (items.length * rowHeight) + totalsHeight + footerHeight;

    finalizeCanvas.width = width;
    finalizeCanvas.height = height;
    const ctx = finalizeCanvas.getContext("2d");

    const inkColor = "#2b2420";
    const inkSoft = "#6b6055";
    const paperColor = "#efe6d8";
    const accent = "#a13d2b";
    const lineColor = "#c9b99a";

    // Background
    ctx.fillStyle = paperColor;
    ctx.fillRect(0, 0, width, height);

    // Border
    ctx.strokeStyle = inkColor;
    ctx.lineWidth = 3 * scale;
    ctx.strokeRect(1.5 * scale, 1.5 * scale, width - 3 * scale, height - 3 * scale);

    let y = 34 * scale;

    // Title
    ctx.fillStyle = inkColor;
    ctx.font = `bold ${20 * scale}px Georgia, serif`;
    ctx.textAlign = "left";
    ctx.fillText("Meal Summary", paddingX, y);

    // Date
    y += 24 * scale;
    ctx.font = `${12 * scale}px Georgia, serif`;
    ctx.fillStyle = inkSoft;
    const dateStr = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    ctx.fillText(dateStr, paddingX, y);

    // Divider
    y += 16 * scale;
    ctx.strokeStyle = inkColor;
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.moveTo(paddingX, y);
    ctx.lineTo(width - paddingX, y);
    ctx.stroke();

    // Itemized list
    y += 26 * scale;
    items.forEach(item => {
      const label = item.qty > 1 ? `${item.name} ×${item.qty}` : item.name;

      ctx.font = `bold ${13 * scale}px Georgia, serif`;
      ctx.fillStyle = inkColor;
      ctx.textAlign = "left";
      ctx.fillText(label, paddingX, y);

      if (item.serving){
        ctx.font = `italic ${10.5 * scale}px Georgia, serif`;
        ctx.fillStyle = inkSoft;
        ctx.fillText(`per ${item.serving}`, paddingX, y + 13 * scale);
      }

      ctx.font = `${12.5 * scale}px 'Courier New', monospace`;
      ctx.fillStyle = inkColor;
      ctx.textAlign = "right";
      ctx.fillText(`${Math.round(item.calories)} cal`, width - paddingX, y);

      ctx.font = `${10 * scale}px 'Courier New', monospace`;
      ctx.fillStyle = inkSoft;
      ctx.fillText(
        `P ${round1(item.protein)}g  C ${round1(item.carbs)}g  F ${round1(item.fat)}g`,
        width - paddingX, y + 13 * scale
      );

      y += rowHeight;
    });

    // Divider before totals
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2 * scale;
    ctx.setLineDash([6 * scale, 5 * scale]);
    ctx.beginPath();
    ctx.moveTo(paddingX, y);
    ctx.lineTo(width - paddingX, y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Totals block
    y += 30 * scale;
    ctx.font = `bold ${15 * scale}px Georgia, serif`;
    ctx.fillStyle = inkColor;
    ctx.textAlign = "left";
    ctx.fillText("Total", paddingX, y);

    ctx.font = `bold ${24 * scale}px 'Courier New', monospace`;
    ctx.fillStyle = accent;
    ctx.textAlign = "right";
    ctx.fillText(`${Math.round(calories)} cal`, width - paddingX, y);

    y += 26 * scale;
    ctx.font = `${13 * scale}px 'Courier New', monospace`;
    ctx.fillStyle = inkColor;
    ctx.textAlign = "left";
    ctx.fillText(`Protein: ${round1(protein)} g`, paddingX, y);

    y += 20 * scale;
    ctx.fillText(`Carbs: ${round1(carbs)} g`, paddingX, y);

    y += 20 * scale;
    ctx.fillText(`Fat: ${round1(fat)} g`, paddingX, y);

    // Footer
    y = height - 16 * scale;
    ctx.font = `${10 * scale}px Georgia, serif`;
    ctx.fillStyle = inkSoft;
    ctx.textAlign = "center";
    ctx.fillText("Ingredient Tracker", width / 2, y);
  }

  finalizeBtn.addEventListener("click", () => {
    drawMealCard();
    finalizeCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      downloadLink.href = url;
      const dateForFile = new Date().toISOString().slice(0, 10);
      downloadLink.download = `meal-summary-${dateForFile}.png`;
    }, "image/png");
    finalizeOverlay.classList.add("open");
  });

  closeFinalizeBtn.addEventListener("click", () => {
    finalizeOverlay.classList.remove("open");
    if (downloadLink.href) URL.revokeObjectURL(downloadLink.href);
  });

  finalizeOverlay.addEventListener("click", (e) => {
    if (e.target === finalizeOverlay){
      finalizeOverlay.classList.remove("open");
    }
  });

  renderGrid();
  updateTotals();

</script>

</body>
</html>
